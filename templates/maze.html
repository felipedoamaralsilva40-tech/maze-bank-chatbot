<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Maze Bank</title>

<style>

body {

    margin: 0;

    font-family: Arial;

    background: #dcdcdc;
}

.logo {

    text-align: center;

    margin-top: 20px;
}

.logo img {

    width: 170px;
}

.chat-container {

    width: 700px;

    height: 500px;

    background: white;

    margin: 20px auto;

    border-radius: 10px;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 15px;

    background: #f3f3f3;
}

.msg {

    padding: 10px;

    border-radius: 10px;

    margin-bottom: 10px;

    max-width: 75%;

    white-space: pre-line;
}

.user {

    background: red;

    color: white;

    margin-left: auto;
}

.bot {

    background: #ddd;

    color: black;
}

.input-area {

    display: flex;

    border-top: 1px solid #ccc;
}

input {

    flex: 1;

    padding: 15px;

    border: none;

    outline: none;
}

button {

    width: 100px;

    border: none;

    background: red;

    color: white;

    cursor: pointer;
}

</style>

</head>

<body>

<div class="logo">

<img src="/static/imagen/logo.png">

</div>

<div class="chat-container">

<div id="messages" class="messages"></div>

<div class="input-area">

<input
    id="input"
    type="text"
    placeholder="Digite sua mensagem..."
>

<button onclick="enviar()">
Enviar
</button>

</div>

</div>

<script>

function addMessage(text, type) {

    const div =
        document.createElement("div");

    div.className =
        "msg " + type;

    div.innerText = text;

    document
        .getElementById("messages")
        .appendChild(div);
}

async function enviar() {

    const input =
        document.getElementById("input");

    const texto =
        input.value;

    if (texto == "") return;

    addMessage(texto, "user");

    input.value = "";

    const response =
        await fetch("/chat", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            pergunta: texto
        })
    });

    const data =
        await response.json();

    addMessage(data.resposta, "bot");
}

document
.getElementById("input")
.addEventListener("keypress", function(e){

    if(e.key === "Enter") {

        enviar();
    }
});

window.onload = function() {

    addMessage(
        "Bem-vindo ao Maze Bank\n\n1 - Entrar\n\n2 - Criar conta",
        "bot"
    );
}

</script>

</body>
</html>
